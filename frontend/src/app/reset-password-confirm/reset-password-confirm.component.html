<div class="auth-wrapper rpc-wrapper">
  <div class="auth-content">
    <div class="rpc-card">
      <div class="rpc-head">
        <div class="rpc-title">Nouveau mot de passe</div>
        <div class="rpc-subtitle">Définissez un nouveau mot de passe pour votre compte.</div>
      </div>

      <form (ngSubmit)="submit()" class="rpc-form">
        <div class="mb-3">
          <label class="form-label">Nouveau mot de passe</label>
          <div class="input-group">
            <span class="input-group-text"><i class="feather icon-lock"></i></span>
            <input
              [type]="showNew ? 'text' : 'password'"
              class="form-control"
              placeholder="Nouveau mot de passe"
              [(ngModel)]="newPassword"
              name="newPassword"
              autocomplete="new-password"
              [disabled]="loading"
              required
            >
            <button type="button" class="btn btn-outline-secondary" (click)="showNew = !showNew" [disabled]="loading">
              <i class="feather" [ngClass]="showNew ? 'icon-eye-off' : 'icon-eye'"></i>
            </button>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Confirmer le mot de passe</label>
          <div class="input-group">
            <span class="input-group-text"><i class="feather icon-shield"></i></span>
            <input
              [type]="showConfirm ? 'text' : 'password'"
              class="form-control"
              placeholder="Confirmer"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              autocomplete="new-password"
              [disabled]="loading"
              required
            >
            <button type="button" class="btn btn-outline-secondary" (click)="showConfirm = !showConfirm" [disabled]="loading">
              <i class="feather" [ngClass]="showConfirm ? 'icon-eye-off' : 'icon-eye'"></i>
            </button>
          </div>
        </div>

        <div *ngIf="message" class="alert mb-3" [ngClass]="isError ? 'alert-danger' : 'alert-success'">
          {{ message }}
        </div>

        <button class="btn btn-primary rpc-submit" type="submit" [disabled]="loading">
          <i class="feather icon-save me-2"></i>
          {{ loading ? 'En cours...' : 'Valider' }}
        </button>

        <div class="rpc-footer">
          <a [routerLink]="['/login']">Retour à la connexion</a>
        </div>
      </form>
    </div>
  </div>
</div>
