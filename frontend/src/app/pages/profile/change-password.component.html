<div class="row">
  <div class="col-sm-12 col-md-6">
    <app-card cardTitle="Changer le mot de passe" [options]="false">
      <form (ngSubmit)="submit()">
        <div class="form-group mb-3">
          <label class="form-label">Mot de passe actuel</label>
          <input type="password" class="form-control" [(ngModel)]="currentPassword" name="currentPassword" required>
        </div>
        <div class="form-group mb-3">
          <label class="form-label">Nouveau mot de passe</label>
          <input type="password" class="form-control" [(ngModel)]="newPassword" name="newPassword" required>
        </div>
        <div class="form-group mb-4">
          <label class="form-label">Confirmer le nouveau mot de passe</label>
          <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" required>
        </div>
        
        <div *ngIf="message" class="alert mb-4" [ngClass]="isError ? 'alert-danger' : 'alert-success'">
          {{ message }}
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="loading">
          {{ loading ? 'En cours...' : 'Enregistrer' }}
        </button>
      </form>
    </app-card>
  </div>
</div>
