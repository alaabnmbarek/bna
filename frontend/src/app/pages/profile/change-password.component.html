<div class="cp-wrapper">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-7 col-xl-6">
      <app-card cardTitle="Changer le mot de passe" [options]="false">
        <div class="cp-subtitle">
          <i class="feather icon-shield me-2"></i>
          Mettez à jour votre mot de passe en toute sécurité.
        </div>

        <form (ngSubmit)="submit()" class="cp-form">
          <div class="mb-3">
            <label class="form-label">Mot de passe actuel</label>
            <div class="input-group">
              <input
                [type]="showCurrent ? 'text' : 'password'"
                class="form-control"
                [(ngModel)]="currentPassword"
                name="currentPassword"
                autocomplete="current-password"
                required
              >
              <button type="button" class="btn btn-outline-secondary" (click)="showCurrent = !showCurrent" [disabled]="loading">
                <i class="feather" [ngClass]="showCurrent ? 'icon-eye-off' : 'icon-eye'"></i>
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Nouveau mot de passe</label>
            <div class="input-group">
              <input
                [type]="showNew ? 'text' : 'password'"
                class="form-control"
                [(ngModel)]="newPassword"
                name="newPassword"
                autocomplete="new-password"
                required
              >
              <button type="button" class="btn btn-outline-secondary" (click)="showNew = !showNew" [disabled]="loading">
                <i class="feather" [ngClass]="showNew ? 'icon-eye-off' : 'icon-eye'"></i>
              </button>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label">Confirmer le nouveau mot de passe</label>
            <div class="input-group">
              <input
                [type]="showConfirm ? 'text' : 'password'"
                class="form-control"
                [(ngModel)]="confirmPassword"
                name="confirmPassword"
                autocomplete="new-password"
                required
              >
              <button type="button" class="btn btn-outline-secondary" (click)="showConfirm = !showConfirm" [disabled]="loading">
                <i class="feather" [ngClass]="showConfirm ? 'icon-eye-off' : 'icon-eye'"></i>
              </button>
            </div>
          </div>

          <div *ngIf="message" class="alert mb-4" [ngClass]="isError ? 'alert-danger' : 'alert-success'">
            {{ message }}
          </div>

          <div class="cp-actions">
            <button type="submit" class="btn btn-primary cp-submit" [disabled]="loading">
              <i class="feather icon-save me-2"></i>
              {{ loading ? 'En cours...' : 'Enregistrer' }}
            </button>
          </div>
        </form>
      </app-card>
    </div>
  </div>
</div>
