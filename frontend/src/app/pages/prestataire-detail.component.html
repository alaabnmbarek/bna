<app-card [cardTitle]="prestataire ? ('Prestataire: ' + prestataire.nom) : 'Prestataire'" [options]="false">
  <div class="d-flex justify-content-between align-items-center">
    <div class="text-muted" *ngIf="prestataire">
      <div><span class="fw-semibold">Type:</span> {{ prestataire.type }}</div>
      <div><span class="fw-semibold">Contact:</span> {{ prestataire.email }} {{ prestataire.telephone ? '• ' + prestataire.telephone : '' }}</div>
      <div><span class="fw-semibold">Disponibilités:</span> {{ prestataire.disponibilites }}</div>
    </div>
    <button class="btn btn-outline-secondary" (click)="back()">Retour</button>
  </div>

  <hr>

  <div class="row g-2">
    <div class="col-md-4">
      <label class="form-label">Titre</label>
      <input class="form-control" [(ngModel)]="missionForm.titre">
    </div>
    <div class="col-md-4">
      <label class="form-label">Référence dossier</label>
      <input class="form-control" [(ngModel)]="missionForm.dossierReference">
    </div>
    <div class="col-md-4">
      <label class="form-label">Statut</label>
      <select class="form-select" [(ngModel)]="missionForm.statut">
        <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
      </select>
    </div>
    <div class="col-12">
      <label class="form-label">Description</label>
      <textarea class="form-control" rows="2" [(ngModel)]="missionForm.description"></textarea>
    </div>
    <div class="col-12 d-flex justify-content-end">
      <button class="btn btn-primary" (click)="createMission()">Affecter Mission</button>
    </div>
  </div>

  <hr>

  <div *ngIf="loading" class="text-muted">Chargement...</div>

  <div class="table-responsive" *ngIf="!loading">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th>Mission</th>
          <th>Statut</th>
          <th>Performance</th>
          <th class="text-end">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of missions">
          <td>
            <div class="fw-semibold">{{ m.titre }}</div>
            <div class="text-muted small">{{ m.dossierReference }}</div>
            <div class="text-muted small">{{ m.description }}</div>
          </td>
          <td style="width: 180px">
            <select class="form-select form-select-sm" [(ngModel)]="update[m.id].statut">
              <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
            </select>
          </td>
          <td style="width: 320px">
            <div class="d-flex gap-2">
              <input class="form-control form-control-sm" type="number" min="1" max="5" placeholder="Note (1-5)" [(ngModel)]="update[m.id].notePerformance">
              <input class="form-control form-control-sm" placeholder="Commentaire" [(ngModel)]="update[m.id].commentairePerformance">
            </div>
          </td>
          <td class="text-end" style="width: 140px">
            <button class="btn btn-outline-primary btn-sm" (click)="saveMission(m.id)">Enregistrer</button>
          </td>
        </tr>
        <tr *ngIf="missions.length === 0">
          <td colspan="4" class="text-center text-muted py-4">Aucune mission</td>
        </tr>
      </tbody>
    </table>
  </div>
</app-card>
