<div class="login-shell">
  <div class="login-left" data-aos="fade-right" data-aos-duration="700">
    <div class="login-left-inner">
      <div class="login-brand">
        <img class="login-logo" src="assets/images/logo-bna-new.png.jpg" alt="BNA BANK" data-aos="zoom-in" data-aos-delay="100">
      </div>

      <h2 class="login-title" data-aos="fade-up" data-aos-delay="150">S'IDENTIFIER</h2>

      <form class="login-form" (ngSubmit)="submit()" data-aos="fade-up" data-aos-delay="200">
        <div class="form-group">
          <label class="login-label" for="login-username">Identifiant</label>
          <div class="login-input">
            <input id="login-username" type="text" placeholder="Identifiant" [(ngModel)]="username" name="username" required>
            <i class="feather icon-user"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="login-label" for="login-password">Mot de passe</label>
          <div class="login-input">
            <input id="login-password" type="password" placeholder="Mot de passe" [(ngModel)]="password" name="password" required>
            <i class="feather icon-eye"></i>
          </div>
        </div>

        <div class="login-row">
          <label class="login-remember">
            <input type="checkbox" [(ngModel)]="remember" name="remember">
            <span>Se souvenir de moi</span>
          </label>
          <a class="login-link" [routerLink]="['/reset-password']">Mot de passe oublié?</a>
        </div>

        <div class="login-error" *ngIf="errorMessage">{{ errorMessage }}</div>

        <button class="login-submit" type="submit" [disabled]="loading">
          {{ loading ? 'Connexion…' : 'Se connecter' }}
        </button>

        <div class="login-bottom">
          <span class="login-muted">Vous n'avez pas un compte ?</span>
          <a class="login-link-strong" [routerLink]="['/register']">S'inscrire</a>
        </div>
      </form>

      <div class="login-footer">BNA BANK 2026 ©</div>
    </div>
  </div>

  <div class="login-right" data-aos="fade-left" data-aos-duration="700">
    <div class="login-right-inner">
      <div class="login-right-title" data-aos="fade-up" data-aos-delay="150">
        <div>Gestion BNA</div>
        <div>des Dossiers</div>
        <div>Contentieux</div>
      </div>

      <div class="login-right-links" data-aos="fade-up" data-aos-delay="250">
        <a href="javascript:">FAQ</a>
        <a href="javascript:">LABEL SECURITY</a>
        <a href="javascript:">LABEL LEGAL</a>
        <a href="javascript:">Contact</a>
      </div>
    </div>
  </div>
</div>
