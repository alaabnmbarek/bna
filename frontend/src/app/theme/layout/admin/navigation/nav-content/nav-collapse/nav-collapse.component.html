<li class="nav-item pcoded-hasmenu" [ngClass]="item().classes!" [class.pcoded-trigger]="expanded()" [class.coded-trigger]="expanded()" [class.active]="expanded()">
  <a href="javascript:" class="nav-link" (click)="navCollapse($event)">
    @if (item().icon) {
      <span class="pcoded-micon">
        <i [ngClass]="item().icon"></i>
      </span>
    }
    <span class="pcoded-mtext">
      {{ item().title }}
    </span>
  </a>
  <ul class="pcoded-submenu" [ngClass]="item().classes!" [style.display]="expanded() ? 'block' : null">
    @for (items of item().children; track items) {
      @if (items.type === 'item') {
        <app-nav-item [item]="items" />
      } @else if (items.type === 'collapse') {
        <app-nav-collapse [item]="items" />
      }
    }
  </ul>
</li>
