@if (item().url && !item().external) {
  <li [ngClass]="item().classes!" [routerLinkActive]="['active']">
    <a class="nav-link" [target]="item().target ? '_blank' : '_self'" [routerLink]="item().url" [queryParams]="item().queryParams" [fragment]="item().fragment" (click)="closeOtherMenu($event)">
      @if (item().icon) {
        <span class="pcoded-micon"><i [ngClass]="item().icon"></i></span>
      }
      <span class="pcoded-mtext">{{ item().title }}</span>
    </a>
  </li>
}
@if (item().url && item().external) {
  <li [ngClass]="item().classes!" [routerLinkActive]="['active']">
    <a [target]="item().target ? '_blank' : '_self'" [href]="item().url">
      @if (item().icon) {
        <span class="pcoded-micon"><i [ngClass]="item().icon"></i></span>
      }
      <span class="pcoded-mtext">{{ item().title }}</span>
    </a>
  </li>
}
