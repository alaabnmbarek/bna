<div class="auth-wrapper">
  <div class="auth-content text-center">
    <h3 class="text-white mb-4">E-Banking</h3>
    <div class="card borderless">
      <div class="row align-items-center text-center">
        <div class="col-md-12">
          <form class="card-body" (ngSubmit)="submit()">
            <h4 class="mb-3 f-w-400">Reset Password</h4>
            <div class="input-group mb-4">
              <input type="email" class="form-control" placeholder="Email" [(ngModel)]="email" name="email" required>
            </div>
            <button class="btn btn-block btn-primary mb-4" type="submit">Send Reset Link</button>
            <p class="mb-0 text-muted">Remembered your password? <a [routerLink]="['/login']" class="f-w-400">Signin</a></p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
