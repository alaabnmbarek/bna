<div class="auth-wrapper reset-wrapper">
  <div class="auth-content">
    <div class="reset-card">
      <div class="reset-head">
        <div class="reset-title">Réinitialiser le mot de passe</div>
        <div class="reset-subtitle">Entrez votre email pour recevoir un lien de réinitialisation.</div>
      </div>

      <form (ngSubmit)="submit()" class="reset-form">
        <div class="mb-4">
          <label class="form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="feather icon-mail"></i></span>
            <input
              type="email"
              class="form-control"
              placeholder="ex: user@bna.tn"
              [(ngModel)]="email"
              name="email"
              autocomplete="email"
              [disabled]="loading"
              required
            >
          </div>
        </div>

        <div *ngIf="message" class="alert mb-3" [ngClass]="isError ? 'alert-danger' : 'alert-success'">
          {{ message }}
        </div>

        <button class="btn btn-primary reset-submit" type="submit" [disabled]="loading">
          <i class="feather icon-send me-2"></i>
          {{ loading ? 'En cours...' : 'Envoyer le lien' }}
        </button>

        <div class="reset-footer">
          <span>Vous vous souvenez de votre mot de passe ?</span>
          <a [routerLink]="['/login']">Se connecter</a>
        </div>
      </form>
    </div>
  </div>
</div>
