services:
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "8025:8025"

  db:
    image: mysql:8.3
    container_name: db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_NAME:-securedb}
      MYSQL_USER: ${DB_USER:-secureuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-securepass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    container_name: backend
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-securedb}
      DB_USER: ${DB_USER:-secureuser}
      DB_PASSWORD: ${DB_PASSWORD:-securepass}
      JWT_SECRET: ${JWT_SECRET:-ZmFrZV9zZWNyZXRfY2hhbmdldGhpcy10b2ludGVuZC1iYXNlNjQ=}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_SMTP_STARTTLS_REQUIRED: ${MAIL_SMTP_STARTTLS_REQUIRED:-false}
      MAIL_SMTP_SSL_TRUST: ${MAIL_SMTP_SSL_TRUST:-}
      URGENCY_ML_ENABLED: ${URGENCY_ML_ENABLED:-false}
      URGENCY_ML_BASE_URL: ${URGENCY_ML_BASE_URL:-http://ml-urgency:8000}
      URGENCY_ML_TIMEOUT_MS: ${URGENCY_ML_TIMEOUT_MS:-3000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

  prediction:
    build: ./Prediction
    container_name: prediction
    environment:
      MODEL_PATH: ${LEGAL_PREDICTION_MODEL_PATH:-/models/xgb_model.pkl}
      FEATURE_COLUMNS_PATH: ${LEGAL_PREDICTION_FEATURE_COLUMNS_PATH:-/models/feature_columns.pkl}
      SCALER_PATH: ${LEGAL_PREDICTION_SCALER_PATH:-/models/scaler.pkl}
    volumes:
      - ./Prediction/models:/models
    ports:
      - "8002:8000"

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  db_data:
